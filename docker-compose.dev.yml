# ──────────────────────────────────────────────────────────────
#  docker-compose.dev.yml — Local development with hot-reload
#  v3: No browser required. Run Redis locally or via Docker.
#
#  Usage:
#    docker compose -f docker-compose.dev.yml up
# ──────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    container_name: metal-redis-dev
    command: redis-server --appendonly no --save "" --maxmemory 32mb
    expose:
      - "6379"
    networks:
      - metal-network-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: metal-api-dev
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=DEBUG
      - DATA_STALENESS_SECONDS=300
      - PYTHONUNBUFFERED=1
    volumes:
      # Hot-reload: mount source files directly
      - ./config.py:/app/config.py:ro
      - ./api.py:/app/api.py:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network-dev
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]

  # Run a single scraper in dev mode (gold only for quick testing)
  scraper-dev:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: metal-scraper-dev
    environment:
      - SCRAPE_TARGET=gold
      - REDIS_URL=redis://redis:6379/0
      - SCRAPE_INTERVAL_SECONDS=60
      - SCRAPE_JITTER_FACTOR=0.1
      - HTTP_TIMEOUT_SECONDS=20
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config.py:/app/config.py:ro
      - ./scraper_daemon.py:/app/scraper_daemon.py:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network-dev

networks:
  metal-network-dev:
    driver: bridge