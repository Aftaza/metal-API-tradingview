# ──────────────────────────────────────────────────────────────
#  docker-compose.yml — Metal Price API v3
#  Architecture: httpx + BeautifulSoup SSR (no headless browser)
#
#  Services:
#    nginx            →  Reverse proxy (public port 80)
#    redis            →  In-memory price store
#    api              →  FastAPI REST endpoint (reads Redis)
#    scraper-gold     →  httpx daemon → Kitco Gold
#    scraper-silver   →  httpx daemon → Kitco Silver
#    scraper-copper   →  httpx daemon → Kitco Copper
#    scraper-usdidr   →  httpx daemon → TradingView USDIDR
#
#  Memory budget (~normal VPS, 2GB RAM):
#    nginx      : 32MB
#    redis      : 64MB
#    api        : 128MB  (2 uvicorn workers)
#    scraper ×4 : 4×64MB = 256MB  (no browser!)
#    Total      : ~480MB — well within 1GB
# ──────────────────────────────────────────────────────────────

services:
  # ── Nginx: reverse proxy + rate limiting ─────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: metal-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - metal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 32M

  # ── Redis: pure in-memory, no disk persistence ───────────────
  redis:
    image: redis:7-alpine
    container_name: metal-redis
    command: >
      redis-server
        --appendonly no
        --save ""
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
        --tcp-backlog 128
        --timeout 0
        --tcp-keepalive 60
    expose:
      - "6379"
    networks:
      - metal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M

  # ── FastAPI: reads prices from Redis ────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: metal-api-v3
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_STALENESS_SECONDS=${DATA_STALENESS_SECONDS:-300}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 192M
        reservations:
          cpus: "0.25"
          memory: 96M

  # ── Scraper: Gold (Kitco → __NEXT_DATA__ JSON) ──────────────
  scraper-gold:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: metal-scraper-gold
    environment:
      - SCRAPE_TARGET=gold
      - REDIS_URL=redis://redis:6379/0
      - SCRAPE_INTERVAL_SECONDS=${SCRAPE_INTERVAL_SECONDS:-30}
      - SCRAPE_JITTER_FACTOR=${SCRAPE_JITTER_FACTOR:-0.3}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-20}
      - RECOVERY_DELAY_SECONDS=${RECOVERY_DELAY_SECONDS:-5}
      - MAX_CONSECUTIVE_FAILURES=${MAX_CONSECUTIVE_FAILURES:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M
        reservations:
          cpus: "0.1"
          memory: 48M

  # ── Scraper: Silver (Kitco → __NEXT_DATA__ JSON) ────────────
  scraper-silver:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: metal-scraper-silver
    environment:
      - SCRAPE_TARGET=silver
      - REDIS_URL=redis://redis:6379/0
      - SCRAPE_INTERVAL_SECONDS=${SCRAPE_INTERVAL_SECONDS:-30}
      - SCRAPE_JITTER_FACTOR=${SCRAPE_JITTER_FACTOR:-0.3}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-20}
      - RECOVERY_DELAY_SECONDS=${RECOVERY_DELAY_SECONDS:-5}
      - MAX_CONSECUTIVE_FAILURES=${MAX_CONSECUTIVE_FAILURES:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M
        reservations:
          cpus: "0.1"
          memory: 48M

  # ── Scraper: Copper (Kitco → __NEXT_DATA__ JSON) ────────────
  scraper-copper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: metal-scraper-copper
    environment:
      - SCRAPE_TARGET=copper
      - REDIS_URL=redis://redis:6379/0
      - SCRAPE_INTERVAL_SECONDS=${SCRAPE_INTERVAL_SECONDS:-30}
      - SCRAPE_JITTER_FACTOR=${SCRAPE_JITTER_FACTOR:-0.3}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-20}
      - RECOVERY_DELAY_SECONDS=${RECOVERY_DELAY_SECONDS:-5}
      - MAX_CONSECUTIVE_FAILURES=${MAX_CONSECUTIVE_FAILURES:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M
        reservations:
          cpus: "0.1"
          memory: 48M

  # ── Scraper: USDIDR (TradingView → SSR JSON regex) ──────────
  scraper-usdidr:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: metal-scraper-usdidr
    environment:
      - SCRAPE_TARGET=usdidr
      - REDIS_URL=redis://redis:6379/0
      - SCRAPE_INTERVAL_SECONDS=${SCRAPE_INTERVAL_SECONDS:-30}
      - SCRAPE_JITTER_FACTOR=${SCRAPE_JITTER_FACTOR:-0.3}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-20}
      - RECOVERY_DELAY_SECONDS=${RECOVERY_DELAY_SECONDS:-5}
      - MAX_CONSECUTIVE_FAILURES=${MAX_CONSECUTIVE_FAILURES:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M
        reservations:
          cpus: "0.1"
          memory: 48M

networks:
  metal-network:
    driver: bridge
