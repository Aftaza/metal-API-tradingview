# ──────────────────────────────────────────────────────────────
#  docker-compose.lowmem.yml — Optimized for VPS 1 Core / 1GB RAM
#  v3: httpx + BeautifulSoup (no browser) → fits easily in 512MB
#
#  Key differences from docker-compose.yml:
#    • 4 separate scrapers → 1 unified scraper (asyncio.gather)
#    • API runs with 1 uvicorn worker
#    • Redis maxmemory: 32MB
#
#  Total memory budget: ~260MB (vs old ~700-800MB with browser)
#
#  Services:
#    nginx    →  Reverse proxy (public port 80)
#    redis    →  In-memory price store (32MB cap)
#    api      →  FastAPI, 1 worker
#    scraper  →  Unified: all 4 targets, concurrent httpx
# ──────────────────────────────────────────────────────────────

services:
  # ── Nginx ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: metal-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - metal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: metal-redis
    command: >
      redis-server
        --appendonly no
        --save ""
        --maxmemory 32mb
        --maxmemory-policy allkeys-lru
        --tcp-backlog 64
        --timeout 0
        --tcp-keepalive 60
    expose:
      - "6379"
    networks:
      - metal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 48M

  # ── FastAPI: 1 worker for low memory ─────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: metal-api-v3
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_STALENESS_SECONDS=${DATA_STALENESS_SECONDS:-300}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network
    restart: unless-stopped
    # Override default 2-worker CMD → 1 worker for RAM savings
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M

  # ── Unified Scraper: ALL 4 targets via asyncio.gather ────────
  # No browser — pure httpx concurrent requests.
  # Memory: ~80MB (vs old 512MB Chromium)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper-unified
    container_name: metal-scraper-unified
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SCRAPE_INTERVAL_SECONDS=${SCRAPE_INTERVAL_SECONDS:-30}
      - SCRAPE_JITTER_FACTOR=${SCRAPE_JITTER_FACTOR:-0.3}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-20}
      - RECOVERY_DELAY_SECONDS=${RECOVERY_DELAY_SECONDS:-5}
      - MAX_CONSECUTIVE_FAILURES=${MAX_CONSECUTIVE_FAILURES:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - metal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M
        reservations:
          cpus: "0.1"
          memory: 48M

networks:
  metal-network:
    driver: bridge
